<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PayQuick — Instant Stablecoin Payments & Payment Requests on Arc</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%232775ca%22/><text x=%2250%22 y=%2266%22 font-size=%2255%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22monospace%22>$</text></svg>" />
<meta name="description" content="PayQuick — instant USDC & EURC payments and shareable payment requests on Arc, Circle's stablecoin-native L1." />
<meta property="og:title" content="PayQuick — Instant Stablecoin Payments & Payment Requests on Arc" />
<meta property="og:description" content="Send, request, and track USDC & EURC payments on Arc — one link, one tap." />
<meta property="og:type" content="website" />
<meta property="og:type" content="website" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --ink: #14132b;
    --paper: #f7f7fc;
    --line: #e3e1f2;
    --usdc-blue: #2775ca;
    --indigo: #6d5ef5;
    --indigo-dark: #4c3fd9;
    --ledger-green: #10b981;
    --rust: #ef4444;
    --muted: #6b6980;
    --card: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .mono { font-family: 'IBM Plex Mono', monospace; }

  header {
    padding: 24px 20px 18px;
    border-bottom: 2px solid var(--ink);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .brand { display: flex; align-items: baseline; gap: 10px; }

  .brand .mark {
    width: 14px;
    height: 14px;
    background: var(--indigo);
    border-radius: 50%;
    display: inline-block;
    transform: translateY(1px);
  }

  /* ---- Coin badges: USDC blue is Circle's documented brand color.
     EURC uses the EU flag's blue/gold as a recognizable "euro" association —
     not verified as Circle's official EURC hex, since that wasn't available to check. ---- */
  .coin-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    font-size: 9px;
    font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
    color: #fff;
    margin-right: 5px;
    flex-shrink: 0;
    transform: translateY(-1px);
  }
  .coin-usdc-badge { background: var(--usdc-blue); }
  .coin-eurc-badge { background: linear-gradient(135deg, #003399 50%, #ffcc00 50%); color: #0e1613; }

  header h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; font-weight: 700; }

  .built-on {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-family: 'IBM Plex Mono', monospace;
    margin-top: 2px;
  }

  .chain-tag {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-family: 'IBM Plex Mono', monospace;
  }

  main { max-width: 480px; margin: 0 auto; padding: 20px 20px 80px; }

  .connect-bar { display: flex; justify-content: center; margin: 40px 0; }

  .hero-tagline {
    text-align: center;
    font-size: 16px;
    color: var(--muted);
    max-width: 320px;
    margin: 30px auto 0;
    line-height: 1.5;
  }

  /* ---- Landing (pre-connect) sections ---- */
  .landing-hero { text-align: center; padding: 10px 0 6px; }

  .landing-headline {
    font-size: 30px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin: 18px 0 12px;
  }

  .landing-sub {
    font-size: 14.5px;
    color: var(--muted);
    max-width: 340px;
    margin: 0 auto 22px;
    line-height: 1.55;
  }

  .landing-cta-row { display: flex; flex-direction: column; gap: 10px; max-width: 320px; margin: 0 auto; }
  .landing-cta-row .link-btn {
    background: none;
    border: none;
    color: var(--ink);
    text-decoration: underline;
    font-size: 13px;
    padding: 4px;
    cursor: pointer;
  }

  .trust-line {
    font-size: 11.5px;
    color: var(--muted);
    margin: 16px auto 0;
    max-width: 320px;
  }

  .badge-pill-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin: 20px 0 4px;
  }

  .badge-pill {
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink);
    background: var(--card);
    border: 1.5px solid var(--line);
    padding: 5px 11px;
    border-radius: 20px;
  }

  .landing-example {
    background: var(--ink);
    color: var(--paper);
    border-radius: 8px;
    padding: 14px 16px;
    max-width: 340px;
    margin: 22px auto 0;
    text-align: left;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
  }
  .landing-example .dot { color: var(--ledger-green); margin-right: 6px; }

  .section-heading {
    text-align: center;
    margin: 46px 0 6px;
  }
  .section-heading .kicker {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }
  .section-heading h2 {
    font-size: 21px;
    font-weight: 700;
    margin: 8px 0 0;
  }

  .feature-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 22px;
  }

  .feature-card {
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 8px;
    padding: 16px 14px;
  }
  .feature-card .f-icon {
    width: 30px; height: 30px;
    border-radius: 7px;
    background: var(--ledger-green);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 14px; font-weight: 700;
    margin-bottom: 10px;
  }
  .feature-card h3 { font-size: 13.5px; margin: 0 0 5px; font-weight: 700; }
  .feature-card p { font-size: 11.5px; color: var(--muted); margin: 0; line-height: 1.45; }

  .steps-list { margin-top: 22px; }
  .step-row {
    display: flex;
    gap: 14px;
    padding: 16px 0;
    border-bottom: 1px solid var(--line);
  }
  .step-row:last-child { border-bottom: none; }
  .step-num {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--paper);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: 13px;
  }
  .step-row h3 { font-size: 14px; margin: 3px 0 4px; font-weight: 700; }
  .step-row p { font-size: 12.5px; color: var(--muted); margin: 0; line-height: 1.45; }

  .final-cta {
    background: var(--ink);
    color: var(--paper);
    border-radius: 10px;
    padding: 30px 22px;
    text-align: center;
    margin-top: 46px;
  }
  .final-cta h2 { font-size: 19px; margin: 0 0 10px; font-weight: 700; }
  .final-cta p { font-size: 13px; color: #b7c9c1; margin: 0 0 20px; line-height: 1.5; }
  .final-cta button { background: linear-gradient(135deg, var(--indigo), var(--indigo-dark)); border-color: var(--indigo-dark); width: 100%; max-width: 280px; }

  .landing-footer {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    margin-top: 26px;
    line-height: 1.8;
  }

  button {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    border: 2px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    padding: 14px 22px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease;
  }

  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--ink); }
  button.full { width: 100%; }

  #connectBtn, #connectBtnBottom {
    background: linear-gradient(135deg, var(--indigo), var(--indigo-dark));
    border-color: var(--indigo-dark);
  }

  .card {
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 6px;
    padding: 20px;
    margin-bottom: 18px;
  }

  .balance-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--ink);
    color: var(--paper);
    border: none;
  }

  .balance-card .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #b7c9c1;
    margin-bottom: 6px;
    font-family: 'IBM Plex Mono', monospace;
  }

  .balance-card .amount {
    font-size: 32px;
    font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: -0.02em;
  }

  .balance-card .addr {
    font-size: 11px;
    color: #8fa39a;
    font-family: 'IBM Plex Mono', monospace;
    margin-top: 8px;
  }

  /* ---- Merchant profile card ---- */
  .merchant-card {
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 24px 22px;
  }

  .merchant-eyebrow {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #8fa39a;
    font-family: 'IBM Plex Mono', monospace;
    margin-bottom: 14px;
  }

  .merchant-name {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.25;
  }

  .merchant-category {
    font-size: 12.5px;
    color: #8fa39a;
    margin-top: 2px;
  }

  .merchant-name-edit {
    background: none;
    border: none;
    color: #8fa39a;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    text-decoration: underline;
    padding: 0;
    cursor: pointer;
    display: block;
    margin: 0 auto;
  }

  .merchant-addr {
    font-size: 11.5px;
    color: #8fa39a;
    font-family: 'IBM Plex Mono', monospace;
    margin-top: 10px;
  }

  .merchant-balance-block {
    margin: 20px 0 22px;
    padding-top: 18px;
    border-top: 1px solid #2a3730;
  }

  .merchant-balance-amt {
    font-size: 28px;
    font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: -0.02em;
  }

  .merchant-balance-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #8fa39a;
    margin-top: 4px;
    font-family: 'IBM Plex Mono', monospace;
  }

  .merchant-stats-row {
    display: flex;
    gap: 14px;
    margin: -6px 0 22px;
  }
  .merchant-stats-row > div { flex: 1; }
  .merchant-stat-num {
    font-size: 18px;
    font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: -0.01em;
  }

  .profile-select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #2a3730;
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    background: #16211c;
    color: var(--paper);
    margin-top: 6px;
  }

  .profile-setup-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .profile-setup-row input {
    margin-bottom: 0;
    background: #16211c;
    border-color: #2a3730;
    color: var(--paper);
  }
  .emoji-picker {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin: 10px 0 4px;
  }
  .emoji-opt {
    width: 34px;
    height: 34px;
    border-radius: 6px;
    background: #16211c;
    border: 1.5px solid #2a3730;
    font-size: 16px;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .emoji-opt.selected { border-color: var(--indigo); background: #241f47; }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 6px;
    margin: 22px 0 14px;
    border-bottom: 1.5px solid var(--line);
  }

  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 10px 4px 12px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1.5px;
  }

  .tab-btn.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 18px;
  }

  .stat-box {
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 6px;
    padding: 12px 10px;
    text-align: center;
  }

  .stat-label {
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    margin-bottom: 5px;
  }

  .stat-value {
    font-size: 17px;
    font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: -0.02em;
  }

  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    margin: 6px 0 10px;
    display: flex;
    justify-content: space-between;
  }

  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    font-family: 'IBM Plex Mono', monospace;
  }

  input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    background: var(--paper);
    color: var(--ink);
    margin-bottom: 14px;
  }

  input:focus { outline: none; border-color: var(--indigo); }

  .field-row { display: flex; gap: 10px; }
  .field-row > div { flex: 1; }

  .currency-btn { opacity: 0.5; }
  .currency-btn.active { opacity: 1; background: var(--ink); color: var(--paper); }

  .status {
    font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
    padding: 10px 12px;
    border-radius: 4px;
    margin-top: 12px;
    display: none;
  }

  .status.show { display: block; }
  .status.pending { background: #fff3d6; color: #8a6100; }
  .status.success { background: #e2f3ea; color: var(--ledger-green); }
  .status.error { background: #fbe4de; color: var(--rust); }

  .ledger-entry {
    border-bottom: 1px solid var(--line);
    padding: 14px 0;
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }

  .ledger-entry:last-child { border-bottom: none; }

  .ledger-entry .dir {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-family: 'IBM Plex Mono', monospace;
    padding: 2px 6px;
    border-radius: 3px;
    display: inline-block;
    margin-bottom: 4px;
  }

  .dir.out { background: #fbe4de; color: var(--rust); }
  .dir.in { background: #e2f3ea; color: var(--ledger-green); }

  .ledger-entry .addr-line { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--ink); }
  .ledger-entry .memo { font-size: 13px; color: var(--muted); margin-top: 3px; font-style: italic; }
  .ledger-entry .tx-link {
    display: inline-block;
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--indigo);
    text-decoration: none;
    margin-top: 5px;
  }
  .ledger-entry .tx-link:active { opacity: 0.7; }
  .ledger-entry .amt { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 15px; white-space: nowrap; }

  .empty { text-align: center; padding: 30px 10px; color: var(--muted); font-size: 13px; font-family: 'IBM Plex Mono', monospace; }

  .contract-line {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    margin-top: 30px;
    word-break: break-all;
  }

  .setup-note {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    max-width: 320px;
    margin: 12px auto 0;
    line-height: 1.5;
  }

  /* ---- Ticket (request) styling ---- */
  .ticket {
    position: relative;
    background: #fff;
    border: 2px dashed var(--line);
    border-radius: 6px;
    padding: 22px;
    margin-bottom: 18px;
  }

  .ticket-eyebrow {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    margin-bottom: 6px;
  }

  .ticket-amount {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .ticket-memo { font-size: 13px; margin-top: 6px; font-style: italic; color: var(--muted); }

  .ticket-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--muted);
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }

  .wallet-picker-overlay {
    position: fixed;
    inset: 0;
    background: rgba(14, 22, 19, 0.55);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 1000;
  }

  .wallet-picker-card {
    background: var(--paper);
    width: 100%;
    max-width: 480px;
    border-radius: 14px 14px 0 0;
    padding: 20px;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.2);
  }

  .wallet-picker-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 14px;
    text-align: center;
  }

  .wallet-picker-row {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 12px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 8px;
    margin-bottom: 8px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
  }
  .wallet-picker-row:active { background: var(--paper); }

  .wallet-picker-cancel {
    width: 100%;
    padding: 12px;
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13.5px;
    margin-top: 4px;
    cursor: pointer;
  }

  .status-badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 10px;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .badge-pending { background: #fff3d6; color: #8a6100; }
  .badge-paid { background: #e2f3ea; color: var(--ledger-green); }
  .badge-expired { background: #fbe4de; color: var(--rust); }

  .stamp {
    position: absolute;
    top: 16px;
    right: 16px;
    border: 3px solid var(--ledger-green);
    color: var(--ledger-green);
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: 16px;
    padding: 3px 10px;
    border-radius: 4px;
    transform: rotate(8deg) scale(0);
    opacity: 0;
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1), opacity 0.2s;
  }
  .stamp.show { transform: rotate(8deg) scale(1); opacity: 1; }

  #qrBox {
    display: flex;
    justify-content: center;
    margin: 4px 0 18px;
    padding: 16px;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 6px;
  }

  .link-box { display: flex; gap: 8px; align-items: center; }
  .link-box input { margin-bottom: 0; font-size: 11px; }

  /* ---- Receipt ---- */
  .receipt {
    background: var(--card);
    border: 1.5px solid var(--ledger-green);
    border-radius: 6px;
    padding: 18px;
    margin-top: 14px;
  }

  .receipt-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ledger-green);
    margin-bottom: 12px;
  }

  .receipt-check {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--ledger-green);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    flex-shrink: 0;
  }

  .receipt-row {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    font-family: 'IBM Plex Mono', monospace;
    padding: 7px 0;
    border-bottom: 1px solid var(--line);
  }
  .receipt-row:last-of-type { border-bottom: none; }
  .receipt-row .k { color: var(--muted); }
  .receipt-row .v { color: var(--ink); text-align: right; word-break: break-all; }

  .receipt-link {
    display: block;
    text-align: center;
    margin-top: 12px;
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--indigo);
    text-decoration: none;
  }
  .receipt-link:active { opacity: 0.7; }
</style>
</head>
<body>

<header>
  <div>
    <div class="brand">
      <span class="mark"></span>
      <h1>PayQuick</h1>
    </div>
    <div class="built-on">Built on Arc</div>
  </div>
  <span class="chain-tag">Arc Testnet · 5042002</span>
</header>

<main id="main"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  // ---- Configuration ----
  const CONTRACT_ADDRESS = "0xd0c5f3e9570CcA0E9913522905b164304A692166"; // PaymentTracker on Arc Testnet
  const ARC_CHAIN_ID_HEX = "0x4CEF52"; // 5042002
  const ARC_CHAIN_ID_DEC = 5042002;
  const ARC_RPC = "https://rpc.testnet.arc.io"; // Circle's official primary RPC (not thirdweb's rate-limited public one)
  const ARC_EXPLORER = "https://testnet.arcscan.app";

  // EURC is a separate ERC-20 token contract (not native currency, not PaymentTracker).
  // Address confirmed from official Arc docs: docs.arc.io/arc/references/contract-addresses
  const EURC_ADDRESS = "0x89B50855Aa3bE2F677cD6303Cec089B5F319D72a";
  const EURC_DECIMALS = 6;

  const ERC20_ABI = [
    "function balanceOf(address owner) view returns (uint256)",
    "function transfer(address to, uint256 amount) returns (bool)"
  ];

  const CONTRACT_ABI = [
    "function sendPayment(address to, string memo) external payable",
    "function getPaymentIdsForAddress(address user) external view returns (uint256[] memory)",
    "function getPayment(uint256 id) external view returns (address from, address to, uint256 amount, string memory memo, uint256 timestamp)",
    "event PaymentSent(uint256 indexed paymentId, address indexed from, address indexed to, uint256 amount, string memo, uint256 timestamp)"
  ];

  let provider, signer, userAddress, contract, eurcContract;
  let sendCurrency = "USDC";
  let requestCurrency = "USDC";

  // A read-only connection to Arc Testnet, so request status can be checked
  // (Pending/Paid/Expired) even before a wallet connects — status is public
  // on-chain data, anyone can read it.
  const readProvider = new ethers.providers.JsonRpcProvider(ARC_RPC);
  const readContract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, readProvider);
  const REQUEST_EXPIRY_HOURS = 24;

  const el = (id) => document.getElementById(id);
  const shorten = (addr) => addr ? addr.slice(0, 6) + "…" + addr.slice(-4) : "";
  const main = el("main");

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  // Fetch many items with a capped number running at once, rather than either
  // fully sequential (slow at scale) or fully parallel (a burst of 50+ requests
  // often gets rate-limited, and Promise.all fails the WHOLE batch if even one
  // call fails). A small worker pool with per-item error handling gives good
  // throughput while surviving individual failures gracefully.
  async function fetchWithLimit(items, limit, fn) {
    const results = new Array(items.length);
    let nextIndex = 0;
    async function worker() {
      while (nextIndex < items.length) {
        const i = nextIndex++;
        try {
          results[i] = await fn(items[i]);
        } catch (err) {
          console.error("Fetch failed for item, skipping:", items[i], err);
          results[i] = null;
        }
      }
    }
    const workerCount = Math.min(limit, items.length);
    await Promise.all(Array.from({ length: workerCount }, worker));
    return results.filter((r) => r !== null);
  }

  function coinBadge(cur) {
    if (cur === "USDC") return '<span class="coin-badge coin-usdc-badge">$</span>';
    return '<span class="coin-badge coin-eurc-badge">€</span>';
  }

  // ---- Receipt: shown after any successful payment (send or pay-request) ----
  function receiptHtml({ amount, currency, counterparty, counterpartyLabel, memo, txHash, timestamp, invoice, network }) {
    const hasHash = !!txHash;
    const explorerLink = hasHash ? ARC_EXPLORER + "/tx/" + txHash : ARC_EXPLORER + "/address/" + CONTRACT_ADDRESS;
    return `
      <div class="receipt">
        <div class="receipt-title"><span class="receipt-check">✓</span> Payment confirmed</div>
        ${invoice ? `<div class="receipt-row"><span class="k">Invoice</span><span class="v">${escapeHtml(invoice)}</span></div>` : ''}
        <div class="receipt-row"><span class="k">Amount</span><span class="v">${coinBadge(currency)}${Number(amount).toLocaleString(undefined, { maximumFractionDigits: 2 })} ${currency}</span></div>
        <div class="receipt-row"><span class="k">${counterpartyLabel}</span><span class="v">${shorten(counterparty)}</span></div>
        <div class="receipt-row"><span class="k">Memo</span><span class="v">${memo ? escapeHtml(memo) : "—"}</span></div>
        <div class="receipt-row"><span class="k">Date/time</span><span class="v">${new Date(timestamp).toLocaleString()}</span></div>
        <div class="receipt-row"><span class="k">Network</span><span class="v">${network || "Arc Testnet"}</span></div>
        ${hasHash ? `<div class="receipt-row"><span class="k">Tx hash</span><span class="v">${shorten(txHash)}</span></div>` : ''}
        <a class="receipt-link" href="${explorerLink}" target="_blank" rel="noopener">${hasHash ? "View on Arc Explorer →" : "View contract on Arc Explorer →"}</a>
      </div>
    `;
  }

  // ---- Request link encoding: the whole request lives in the URL, no server needed ----
  function buildRequestLink(to, amt, cur, memo, inv, ts) {
    const params = new URLSearchParams({ to, amt, cur, memo, inv: inv || "", ts: ts || Date.now() });
    return location.origin + location.pathname + "?" + params.toString();
  }

  function parseRequestFromURL() {
    const params = new URLSearchParams(location.search);
    const to = params.get("to");
    const amt = params.get("amt");
    const cur = params.get("cur");
    const memo = params.get("memo") || "";
    const inv = params.get("inv") || "";
    const ts = parseInt(params.get("ts"), 10) || Date.now();
    if (!to || !amt || !cur) return null;
    if (!ethers.utils.isAddress(to)) return null;
    if (cur !== "USDC" && cur !== "EURC") return null;
    if (isNaN(amt) || Number(amt) <= 0) return null;
    return { to, amt, cur, memo, inv, ts };
  }

  // ---- Check a request's real status against the chain ----
  // A request is "paid" when a USDC payment exists on PaymentTracker, sent to the
  // requested address, for the requested amount, tagged with this request's invoice
  // number in its on-chain memo. This is public data — no wallet connection required.
  // EURC requests can't be checked this way since EURC transfers don't go through
  // PaymentTracker at all (a known limitation, surfaced honestly in the UI).
  // Prefer the wallet's own connection for reads once connected — we know that
  // works, since balance/history already rely on it. Only fall back to the raw
  // public RPC for pre-connect checks, where no wallet is available yet.
  function getStatusContract() {
    if (isConnected && contract) return contract;
    return readContract;
  }

  async function checkRequestStatus(req) {
    if (req.cur !== "USDC") {
      return { status: "unsupported" };
    }

    const preferred = getStatusContract();
    const fallback = preferred === readContract ? (isConnected && contract ? contract : null) : readContract;

    let lastError = null;
    for (const reader of [preferred, fallback]) {
      if (!reader) continue;
      try {
        const targetAmount = ethers.utils.parseUnits(req.amt, 18);
        const ids = await reader.getPaymentIdsForAddress(req.to);
        const tag = "[" + req.inv + "]";

        // Fetch every payment in parallel rather than one at a time — with a
        // growing payment history, awaiting each call sequentially gets slow
        // and can time out. A batch of parallel calls is far more reliable.
        const payments = await fetchWithLimit(ids, 8, (id) => reader.getPayment(id).then((p) => ({ id, p })));

        const match = payments.find(({ p }) =>
          p.to.toLowerCase() === req.to.toLowerCase() &&
          p.amount.eq(targetAmount) &&
          (!req.inv || p.memo.includes(tag))
        );

        if (match) {
          let txHash = null;
          try {
            const logs = await reader.queryFilter(reader.filters.PaymentSent(match.id));
            if (logs[0]) txHash = logs[0].transactionHash;
          } catch (e) {
            console.error("Could not fetch tx hash for paid request:", e);
          }

          return {
            status: "paid",
            from: match.p.from,
            amount: ethers.utils.formatUnits(match.p.amount, 18),
            timestamp: match.p.timestamp.toNumber() * 1000,
            txHash,
          };
        }

        const expiresAt = req.ts + REQUEST_EXPIRY_HOURS * 60 * 60 * 1000;
        if (Date.now() > expiresAt) {
          return { status: "expired" };
        }
        return { status: "pending" };
      } catch (err) {
        console.error("Status check failed with one reader, trying fallback if available:", err);
        lastError = err;
      }
    }

    return { status: "unknown", error: (lastError && (lastError.reason || lastError.message)) || "Unknown error" };
  }

  let activeProvider = null; // the specific wallet provider the user picked (or the only one available)

  // ---- Discover every wallet available in this browser, so the person can pick ----
  // Modern wallets announce themselves via EIP-6963 (multiple can coexist safely).
  // Older wallets sometimes stack onto window.ethereum.providers[]. If neither
  // signal appears, we fall back to plain window.ethereum (the common case when
  // opening PayQuick inside a wallet app's own built-in browser).
  function discoverWallets() {
    return new Promise((resolve) => {
      const found = new Map();

      function handleAnnounce(event) {
        const { info, provider } = event.detail;
        found.set(info.uuid, { name: info.name, icon: info.icon, provider });
      }
      window.addEventListener("eip6963:announceProvider", handleAnnounce);
      window.dispatchEvent(new Event("eip6963:requestProvider"));

      setTimeout(() => {
        window.removeEventListener("eip6963:announceProvider", handleAnnounce);

        if (found.size === 0 && window.ethereum) {
          const legacyList = window.ethereum.providers && window.ethereum.providers.length
            ? window.ethereum.providers
            : [window.ethereum];
          legacyList.forEach((p, i) => {
            let name = "Wallet";
            if (p.isMetaMask) name = "MetaMask";
            else if (p.isRabby) name = "Rabby";
            else if (p.isCoinbaseWallet) name = "Coinbase Wallet";
            else if (p.isOkxWallet || p.isOKExWallet) name = "OKX Wallet";
            else if (p.isTrust) name = "Trust Wallet";
            found.set("legacy-" + i, { name, icon: null, provider: p });
          });
        }

        resolve(Array.from(found.values()));
      }, 200);
    });
  }

  function walletIconHtml(w) {
    if (w.icon) return `<img src="${w.icon}" alt="" style="width:28px; height:28px; border-radius:6px;" />`;
    return `<span class="coin-badge coin-usdc-badge" style="width:28px; height:28px; font-size:13px;">${w.name.charAt(0)}</span>`;
  }

  // Shows a picker only if there's a real choice to make; connects straight
  // through if there's exactly one wallet (the common in-app-browser case).
  async function chooseWallet() {
    const wallets = await discoverWallets();

    if (wallets.length === 0) {
      const msg = "No wallet detected. Open this page inside a wallet app's built-in browser (MetaMask, Rabby, OKX Wallet, etc.), or install a wallet extension.";
      if (el("payStatus")) { showPayStatus(msg, "error"); }
      else { alert(msg); }
      return null;
    }

    if (wallets.length === 1) {
      return wallets[0].provider;
    }

    return new Promise((resolve) => {
      const overlay = document.createElement("div");
      overlay.className = "wallet-picker-overlay";
      overlay.innerHTML = `
        <div class="wallet-picker-card">
          <div class="wallet-picker-title">Choose a wallet</div>
          ${wallets.map((w, i) => `
            <button type="button" class="wallet-picker-row" data-idx="${i}">
              ${walletIconHtml(w)}
              <span>${escapeHtml(w.name)}</span>
            </button>
          `).join("")}
          <button type="button" class="wallet-picker-cancel" id="walletPickerCancel">Cancel</button>
        </div>
      `;
      document.body.appendChild(overlay);

      overlay.querySelectorAll(".wallet-picker-row").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = parseInt(btn.dataset.idx, 10);
          document.body.removeChild(overlay);
          resolve(wallets[idx].provider);
        });
      });
      el("walletPickerCancel").addEventListener("click", () => {
        document.body.removeChild(overlay);
        resolve(null);
      });
    });
  }

  async function connectWallet() {
    const chosen = await chooseWallet();
    if (!chosen) return null;
    activeProvider = chosen;

    await activeProvider.request({ method: "eth_requestAccounts" });
    provider = new ethers.providers.Web3Provider(activeProvider);

    const network = await provider.getNetwork();
    if (network.chainId !== ARC_CHAIN_ID_DEC) {
      await switchToArc();
      provider = new ethers.providers.Web3Provider(activeProvider);
    }

    signer = provider.getSigner();
    userAddress = await signer.getAddress();
    contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
    eurcContract = new ethers.Contract(EURC_ADDRESS, ERC20_ABI, signer);

    activeProvider.on("accountsChanged", () => location.reload());
    activeProvider.on("chainChanged", () => location.reload());

    return userAddress;
  }

  async function switchToArc() {
    try {
      await activeProvider.request({
        method: "wallet_switchEthereumChain",
        params: [{ chainId: ARC_CHAIN_ID_HEX }],
      });
    } catch (switchError) {
      // Different wallets report "chain not added yet" differently — some use
      // the standard EIP-3085 code 4902, others (like Mises Browser) report it
      // some other way entirely. Rather than trust one specific error code,
      // just attempt to add the chain whenever switching fails at all.
      try {
        await activeProvider.request({
          method: "wallet_addEthereumChain",
          params: [{
            chainId: ARC_CHAIN_ID_HEX,
            chainName: "Arc Testnet",
            // Arc's native USDC gas token uses 18 decimals (per official Arc docs)
            nativeCurrency: { name: "USDC", symbol: "USDC", decimals: 18 },
            rpcUrls: [ARC_RPC],
            blockExplorerUrls: [ARC_EXPLORER],
          }],
        });
      } catch (addError) {
        console.error("Adding Arc Testnet failed too:", addError);
        throw addError;
      }
    }
  }

  // =========================================================
  // PAY MODE — someone opened a shared request link
  // =========================================================
  let statusPollInterval = null;
  let requestIsPaid = false;

  function statusBadgeHtml(status) {
    const map = {
      pending: ["Pending", "badge-pending"],
      paid: ["Paid", "badge-paid"],
      expired: ["Expired", "badge-expired"],
      unsupported: ["Status unavailable for EURC", "badge-pending"],
      unknown: ["Checking…", "badge-pending"],
    };
    const [label, cls] = map[status] || map.unknown;
    return `<span class="status-badge ${cls}">${label}</span>`;
  }

  function renderPayView(req) {
    requestIsPaid = false;
    main.innerHTML = `
      <div class="ticket">
        <div class="stamp" id="paidStamp">PAID</div>
        <div class="ticket-eyebrow">Payment requested ${req.inv ? `<span class="mono" style="float:right;">${escapeHtml(req.inv)}</span>` : ''}</div>
        <div class="ticket-amount">${coinBadge(req.cur)}${Number(req.amt).toLocaleString(undefined, { maximumFractionDigits: 2 })} ${req.cur}</div>
        <div class="ticket-memo">${req.memo ? escapeHtml(req.memo) : "No memo"}</div>
        <div class="ticket-row"><span>Pay to</span><span>${shorten(req.to)}</span></div>
        <div class="ticket-row"><span>Status</span><span id="statusBadgeSlot">${statusBadgeHtml("unknown")}</span></div>
        ${req.cur === "EURC" ? '<div class="ticket-row"><span>Note</span><span>EURC sends aren\u2019t logged in history</span></div>' : ''}
      </div>

      <div id="expiredNote" class="status show error" style="display:none; margin-bottom:14px;">
        This request is past its 24-hour window. You can still try paying, but check with the merchant first.
      </div>

      <div class="card" id="payCard">
        <div class="connect-bar" id="connectBar" style="margin:10px 0;">
          <button class="full" id="connectBtn">Connect wallet to pay</button>
        </div>
        <button class="full" id="payBtn" style="display:none;">Pay ${req.cur}</button>
        <div class="status" id="payStatus"></div>
        <div id="payReceipt"></div>
      </div>

      <p class="setup-note"><a href="${location.origin + location.pathname}">Open PayQuick</a> to send, request, or view your history.</p>
    `;

    el("connectBtn").addEventListener("click", async () => {
      try {
        el("connectBtn").disabled = true;
        await connectWallet();
        el("connectBar").style.display = "none";
        el("payBtn").style.display = "block";
        if (!requestIsPaid) pollRequestStatus(req); // re-check now that reads can go through the wallet
      } catch (err) {
        showPayStatus("Connection failed: " + (err.message || err), "error");
        el("connectBtn").disabled = false;
      }
    });

    el("payBtn").addEventListener("click", async () => {
      try {
        el("payBtn").disabled = true;
        showPayStatus("Confirm the transaction in your wallet…", "pending");

        let tx;
        if (req.cur === "USDC") {
          const value = ethers.utils.parseUnits(req.amt, 18);
          // Tag the on-chain memo with the invoice number so this exact payment
          // can be matched back to this request — that's what makes status
          // detection possible for anyone viewing this link, without a backend.
          const taggedMemo = (req.memo || "—") + (req.inv ? ` [${req.inv}]` : "");
          tx = await contract.sendPayment(req.to, taggedMemo, { value });
        } else {
          const value = ethers.utils.parseUnits(req.amt, EURC_DECIMALS);
          tx = await eurcContract.transfer(req.to, value);
        }

        showPayStatus("Submitted. Waiting for confirmation…", "pending");
        const receipt = await tx.wait();

        showPayStatus("Payment complete!", "success");
        markRequestPaid({
          from: userAddress,
          amount: req.amt,
          timestamp: Date.now(),
          txHash: receipt.transactionHash,
        }, req);
      } catch (err) {
        console.error(err);
        const msg = err?.reason || err?.data?.message || err?.message || "Transaction failed.";
        showPayStatus(msg, "error");
        el("payBtn").disabled = false;
      }
    });

    pollRequestStatus(req);
  }

  function markRequestPaid(result, req) {
    if (statusPollInterval) clearInterval(statusPollInterval);
    if (statusPollInterval) clearInterval(statusPollInterval);
    requestIsPaid = true;
    el("statusBadgeSlot").innerHTML = statusBadgeHtml("paid");
    el("paidStamp").classList.add("show");
    el("connectBar").style.display = "none";
    el("payBtn").style.display = "none";
    el("expiredNote").style.display = "none";
    el("payReceipt").innerHTML = receiptHtml({
      amount: result.amount,
      currency: req.cur,
      counterparty: result.from,
      counterpartyLabel: "Payer",
      memo: req.memo,
      txHash: result.txHash,
      timestamp: result.timestamp,
      invoice: req.inv,
      network: "Arc Testnet",
    });
  }

  async function pollRequestStatus(req) {
    const check = async () => {
      if (requestIsPaid) return;
      const result = await checkRequestStatus(req);
      if (requestIsPaid) return; // a direct "just paid" update may have landed while this was in flight
      if (result.status === "paid") {
        markRequestPaid(result, req);
        return;
      }
      const slot = el("statusBadgeSlot");
      if (slot) slot.innerHTML = statusBadgeHtml(result.status);
      const expiredNote = el("expiredNote");
      if (expiredNote) expiredNote.style.display = result.status === "expired" ? "block" : "none";
    };
    await check();
    if (statusPollInterval) clearInterval(statusPollInterval);
    if (!requestIsPaid) {
      statusPollInterval = setInterval(check, 7000);
    }
  }

  function showPayStatus(msg, type) {
    const s = el("payStatus");
    s.textContent = msg;
    s.className = "status show " + type;
  }


  // =========================================================
  // MAIN APP — Send / Request / History tabs
  // =========================================================
  function renderMainApp() {
    main.innerHTML = `
      <div id="preConnectPrompt">
        <div class="landing-hero">
          <div class="landing-headline">Get paid in one tap.<br/>No addresses, no guesswork.</div>
          <p class="landing-sub">PayQuick turns any payment into a shareable link or QR code. Built on Arc, settled in USDC or EURC, and every payment is verifiable on-chain — not just a screenshot.</p>

          <div class="landing-cta-row">
            <button class="full" id="connectBtn">Connect wallet</button>
            <button type="button" class="link-btn" id="seeHowItWorksBtn">See how it works ↓</button>
          </div>

          <p class="trust-line">Non-custodial · testnet USDC &amp; EURC · every payment verifiable on Arc Explorer</p>

          <div class="badge-pill-row">
            <span class="badge-pill">Arc Testnet</span>
            <span class="badge-pill">USDC + EURC</span>
            <span class="badge-pill">Non-custodial</span>
            <span class="badge-pill">On-chain receipts</span>
          </div>

          <div class="landing-example">
            <span class="dot">●</span>Received 5 USDC from 0x8455…25b7 — "Rent" — just now, verified on Arc Explorer.
          </div>
        </div>

        <div class="section-heading" id="howItWorksSection">
          <div class="kicker">Everything a small merchant needs</div>
          <h2>One page. Real payments.</h2>
        </div>
        <div class="feature-grid">
          <div class="feature-card">
            <div class="f-icon">◎</div>
            <h3>Connect Wallet</h3>
            <p>MetaMask, Rabby, OKX and more — pick your wallet, auto-configures Arc Testnet.</p>
          </div>
          <div class="feature-card">
            <div class="f-icon">→</div>
            <h3>Send</h3>
            <p>Send USDC or EURC to any address, with a memo attached.</p>
          </div>
          <div class="feature-card">
            <div class="f-icon">▦</div>
            <h3>Request + QR</h3>
            <p>Generate a shareable link and QR code for any amount — no address needed.</p>
          </div>
          <div class="feature-card">
            <div class="f-icon">✓</div>
            <h3>Live Status</h3>
            <p>Watch a request flip from Pending to Paid, live, right on the page.</p>
          </div>
          <div class="feature-card">
            <div class="f-icon">▤</div>
            <h3>Receipts</h3>
            <p>Every payment gets a receipt: amount, payer, time, and a link to Arc Explorer.</p>
          </div>
          <div class="feature-card">
            <div class="f-icon">◫</div>
            <h3>Dashboard</h3>
            <p>Revenue, payments received, and today's total — pulled live from the chain.</p>
          </div>
        </div>

        <div class="section-heading">
          <div class="kicker">From request to receipt</div>
          <h2>How it works</h2>
        </div>
        <div class="steps-list">
          <div class="step-row">
            <div class="step-num">1</div>
            <div>
              <h3>Request</h3>
              <p>Enter an amount and what it's for. PayQuick generates a link and QR code — no wallet address to share.</p>
            </div>
          </div>
          <div class="step-row">
            <div class="step-num">2</div>
            <div>
              <h3>Share</h3>
              <p>Send the link, or let your customer scan the QR code. Either one opens the exact same request.</p>
            </div>
          </div>
          <div class="step-row">
            <div class="step-num">3</div>
            <div>
              <h3>Pay</h3>
              <p>Your customer connects a wallet and taps Pay. That's the whole flow — no typing, no guessing.</p>
            </div>
          </div>
          <div class="step-row">
            <div class="step-num">4</div>

  let myRequestsPollInterval = null;

  let isConnected = false;
  const AVATAR_OPTIONS = ["🏪", "☕", "🍕", "🛍️", "💼", "🚀", "🎨", "📦", "🧾", "💈"];

  function invoiceKey(addr) { return "payquick_invoice_seq_" + addr.toLowerCase(); }

  async function sendPayment() {
    const to = el("toAddr").value.trim();
    const amountStr = el("amount").value.trim();
    const memo = el("memo").value.trim() || "—";

    if (!ethers.utils.isAddress(to)) {
      showSendStatus("Enter a valid recipient address.", "error");
      return;
    }
    if (!amountStr || isNaN(amountStr) || Number(amountStr) <= 0) {
      showSendStatus("Enter a valid amount greater than 0.", "error");
      return;
    }

    if (!isConnected) {
      showSendStatus("Connecting your wallet…", "pending");
      const ok = await handleConnect();
      if (!ok) {
        showSendStatus("Connect your wallet to send a payment.", "error");
        return;
      }
    }

    try {
      el("sendBtn").disabled = true;
      el("sendReceipt").innerHTML = "";
      showSendStatus("Confirm the transaction in your wallet…", "pending");

      let tx;
      if (sendCurrency === "USDC") {
        const value = ethers.utils.parseUnits(amountStr, 18);
        tx = await contract.sendPayment(to, memo, { value });
      } else {
        const value = ethers.utils.parseUnits(amountStr, EURC_DECIMALS);
        tx = await eurcContract.transfer(to, value);
      }

      showSendStatus("Transaction submitted. Waiting for confirmation…", "pending");
      const receipt = await tx.wait();

      showSendStatus("Payment sent!", "success");
      el("sendReceipt").innerHTML = receiptHtml({
        amount: amountStr,
        currency: sendCurrency,
        counterparty: to,
        counterpartyLabel: "Sent to",
        memo: memo === "—" ? "" : memo,
        txHash: receipt.transactionHash,
        timestamp: Date.now(),
      });
      el("toAddr").value = "";
      el("amount").value = "";
      el("memo").value = "";

      await refreshBalance();
      await refreshHistory();
    } catch (err) {
      console.error(err);
      const msg = err?.reason || err?.data?.message || err?.message || "Transaction failed.";
      showSendStatus(msg, "error");
    } finally {
      el("sendBtn").disabled = false;
    }
  }

  async function generateRequest() {

    const memo = el("reqMemo").value.trim();

      alert("Enter a valid amount.");
      return;

    if (!isConnected) {
      const ok = await handleConnect();
      if (!ok) return;
    }

    const invoiceNum = nextInvoiceNumber(userAddress);
    const ts = Date.now();
    const link = buildRequestLink(userAddress, amt, requestCurrency, memo, invoiceNum, ts);

    saveMyRequest(userAddress, { to: userAddress, amt, cur: requestCurrency, memo, inv: invoiceNum, ts, link });

    el("requestFormCard").style.display = "none";
    el("requestResult").style.display = "block";

  // ---- "My Requests" — a merchant's own list of requests they've generated,
  // stored locally, with live status pulled from the chain. ----
  function myRequestsKey(addr) { return "payquick_myrequests_" + addr.toLowerCase(); }

  function loadMyRequests(addr) {
    try {
      const raw = localStorage.getItem(myRequestsKey(addr));
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveMyRequest(addr, requestEntry) {
    try {
      const list = loadMyRequests(addr);
      list.unshift(requestEntry);
      localStorage.setItem(myRequestsKey(addr), JSON.stringify(list.slice(0, 25)));
    } catch (e) {
      console.error("Could not save request:", e);
    }
  }

  // Once a request is confirmed paid, that fact is permanent — blockchain
  // history doesn't reverse itself. Cache it and never re-check or overwrite
  // it again, so a single flaky read on a later poll can't make a confirmed
  // payment flicker back to "checking" or "pending".
  const myReqStatusCache = {};

  async function renderMyRequests() {
    const container = el("myRequestsList");
    if (!container || !userAddress) return;
    const requests = loadMyRequests(userAddress);

    if (requests.length === 0) {
      container.innerHTML = '<div class="empty">No requests created yet.</div>';
      return;
    }

    container.innerHTML = requests.map((r, i) => {
      const cached = myReqStatusCache[r.inv];
      const initialBadge = cached ? statusBadgeHtml(cached.status) : statusBadgeHtml("unknown");
      return `
      <div class="ledger-entry" id="myReq-${i}">
        <div>
          <span class="mono" style="font-size:11px; color:var(--muted);">${escapeHtml(r.inv || "")}</span>
          <div class="addr-line">${coinBadge(r.cur)}${Number(r.amt).toLocaleString(undefined, { maximumFractionDigits: 2 })} ${r.cur}</div>
          <div class="memo">${r.memo ? escapeHtml(r.memo) : "No memo"}</div>
        </div>
        <div style="text-align:right;">
          <span id="myReqStatus-${i}">${initialBadge}</span>
          <div style="font-size:11px; color:var(--muted); font-family:'IBM Plex Mono',monospace; margin-top:6px;">
            ${new Date(r.ts).toLocaleDateString()}
          </div>
        </div>
      </div>
    `;
    }).join("");

    requests.forEach(async (r, i) => {
      // Already confirmed paid — skip re-checking entirely, nothing can change this.
      if (myReqStatusCache[r.inv] && myReqStatusCache[r.inv].status === "paid") return;

      const result = await checkRequestStatus(r);
      myReqStatusCache[r.inv] = result;
      const slot = el("myReqStatus-" + i);
      if (slot) slot.innerHTML = statusBadgeHtml(result.status);
    });
  }

  async function refreshHistory() {
    try {
      const ids = await contract.getPaymentIdsForAddress(userAddress);
      const list = el("historyList");
      const empty = el("historyEmpty");
      list.innerHTML = "";

      if (ids.length === 0) {
        empty.textContent = "No payments yet.";
        empty.style.display = "block";
        el("historyCount").textContent = "";
        el("statSent").textContent = "0";
        el("statReceived").textContent = "0";
        el("statCount").textContent = "0";
        el("statToday").textContent = "0";
        el("statPaymentsReceived").textContent = "0";
        el("statTotalRevenue").textContent = "0.00 USDC";
        return;
      }
      empty.style.display = "none";

      const sortedIds = [...ids].sort((a, b) => b.sub(a));

      // Look up the actual transaction hash for each payment via its event log,
      // so history entries can link to Arc Explorer as proof, not just show a memo.
      // Scanning is done in chunks since most RPC providers cap how far back a
      // single log query can look in one request.
      const txHashById = {};
      let logLookupFailed = false;
      try {
        const latestBlock = await provider.getBlockNumber();
        const CHUNK_SIZE = 5000;
        const MAX_CHUNKS = 40; // covers the most recent ~200,000 blocks
        const filters = [
          contract.filters.PaymentSent(null, userAddress, null),
          contract.filters.PaymentSent(null, null, userAddress),
        ];

        let toBlock = latestBlock;
        let chunksScanned = 0;
        let anyChunkSucceeded = false;

        while (toBlock >= 0 && chunksScanned < MAX_CHUNKS) {
          const fromBlock = Math.max(0, toBlock - CHUNK_SIZE + 1);
          try {
            const [sentLogs, receivedLogs] = await Promise.all([
              contract.queryFilter(filters[0], fromBlock, toBlock),
              contract.queryFilter(filters[1], fromBlock, toBlock),
            ]);
            for (const log of [...sentLogs, ...receivedLogs]) {
              txHashById[log.args.paymentId.toString()] = log.transactionHash;
            }
            anyChunkSucceeded = true;
          } catch (chunkErr) {
            console.error("Chunk query failed for blocks " + fromBlock + "-" + toBlock, chunkErr);
          }
          toBlock = fromBlock - 1;
          chunksScanned++;
          // Stop early once every currently-loaded payment has a hash
          if (Object.keys(txHashById).length >= sortedIds.length) break;
        }

        if (!anyChunkSucceeded) logLookupFailed = true;
      } catch (logErr) {
        console.error("Could not fetch transaction hashes:", logErr);
        logLookupFailed = true;
      }

      let totalSent = 0;
      let totalReceived = 0;
      let todayReceived = 0;
      let receivedCount = 0;
      const todayStr = new Date().toDateString();

      // Fetch every payment in parallel — with 50+ payments, awaiting these
      // one at a time was slow enough to time out. A parallel batch finishes
      // in roughly the time of one call instead of fifty.
      const payments = await fetchWithLimit(sortedIds, 8, (id) => contract.getPayment(id).then((p) => ({ id, p })));

      if (payments.length < ids.length) {
        el("historyCount").textContent = payments.length + " of " + ids.length + " loaded";
      } else {
        el("historyCount").textContent = ids.length + " total";
      }

      for (const { id, p } of payments) {
        const isOutgoing = p.from.toLowerCase() === userAddress.toLowerCase();
        const amt = ethers.utils.formatUnits(p.amount, 18);
        const date = new Date(p.timestamp.toNumber() * 1000);
        const txHash = txHashById[id.toString()];

        if (isOutgoing) {
          totalSent += Number(amt);
        } else {
          totalReceived += Number(amt);
          receivedCount++;
          if (date.toDateString() === todayStr) todayReceived += Number(amt);
        }

        const entry = document.createElement("div");
        entry.className = "ledger-entry";
        const counterpartyAddr = isOutgoing ? p.to : p.from;
        const txLink = txHash
          ? `<a href="${ARC_EXPLORER}/tx/${txHash}" target="_blank" rel="noopener" class="tx-link">View on Arc Explorer →</a>`
          : `<a href="${ARC_EXPLORER}/address/${CONTRACT_ADDRESS}" target="_blank" rel="noopener" class="tx-link">View contract on Arc Explorer →</a>`;
        entry.innerHTML = `
          <div>
            <span class="dir ${isOutgoing ? 'out' : 'in'}">${isOutgoing ? 'Sent' : 'Received'}</span>
            <div class="addr-line">${isOutgoing ? 'to ' + shorten(p.to) : 'from ' + shorten(p.from)}</div>
            <div class="memo">${escapeHtml(p.memo)}</div>
            ${txLink}
          </div>
          <div style="text-align:right;">
            <div class="amt" style="color:${isOutgoing ? 'var(--rust)' : 'var(--ledger-green)'}">
              ${isOutgoing ? '\u2212' : '+'}${Number(amt).toLocaleString(undefined, { maximumFractionDigits: 2 })}
            </div>
            <div style="font-size:11px; color:var(--muted); font-family:'IBM Plex Mono',monospace;">
              ${date.toLocaleDateString()} ${date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
            </div>
          </div>
        `;
        list.appendChild(entry);
      }

      const explorerNote = el("explorerNote");
      if (explorerNote) {
        explorerNote.style.display = logLookupFailed ? "block" : "none";
      }

      el("statSent").textContent = totalSent.toLocaleString(undefined, { maximumFractionDigits: 2 });
      el("statReceived").textContent = totalReceived.toLocaleString(undefined, { maximumFractionDigits: 2 });
      el("statCount").textContent = payments.length;
      el("statToday").textContent = todayReceived.toLocaleString(undefined, { maximumFractionDigits: 2 });
      el("statPaymentsReceived").textContent = receivedCount;
      el("statTotalRevenue").textContent = totalReceived.toLocaleString(undefined, { maximumFractionDigits: 2 }) + " USDC";
    } catch (err) {
      console.error(err);
      const empty = el("historyEmpty");
      empty.textContent = "Couldn't load history — check your connection and try again.";
      empty.style.display = "block";
      el("statSent").textContent = "—";
      el("statReceived").textContent = "—";
      el("statCount").textContent = "—";
      el("statToday").textContent = "—";
      el("statPaymentsReceived").textContent = "—";
      el("statTotalRevenue").textContent = "—";
    }
  }

  // ---- Entry point: pay-mode link, or the main tabbed app ----
  const req = parseRequestFromURL();
  if (req) {
    renderPayView(req);
  } else {
    renderMainApp();
    // Auto-connect if already authorized
    if (window.ethereum && window.ethereum.selectedAddress) {
      handleConnect();
    }
  }
</script>

</body>
</html>
